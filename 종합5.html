<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 매경테스트 최신 실전 모의고사 (80문항 완벽구현)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      color: var(--text-main);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-warning {
      background-color: #d97706;
      color: white;
    }

    .cbt-container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 968px) {
      .cbt-container {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px;
      }
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .mode-badge {
      background-color: #fef2f2;
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
    }

    .progress-text {
      font-size: 0.95rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      word-break: keep-all;
      line-height: 1.6;
      color: #1e293b;
      white-space: pre-line;
    }

    .question-box {
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.65;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background-color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
      color: #334155;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover:not(.correct):not(.wrong) {
      background-color: #f8fafc;
      border-color: var(--primary);
      color: var(--primary);
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 700;
    }

    .explanation-box {
      margin-top: 15px;
      padding: 20px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      white-space: pre-line;
      line-height: 1.7;
      color: #166534;
      font-size: 0.95rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .navigation-bar {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 24px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      color: #334155;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    .keyboard-tip {
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: center;
      font-weight: 500;
      width: 100%;
    }

    @media(min-width: 768px) {
      .keyboard-tip { width: auto; }
    }

    .sidebar-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 16px;
    }

    .omr-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .omr-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-summary {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .omr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .omr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      background-color: #fff;
      transition: all 0.15s;
    }

    .omr-item:hover {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    .omr-item.active {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-none { background: #f1f5f9; color: var(--text-sub); }
    .status-correct { background: var(--correct-bg); color: var(--correct-text); }
    .status-wrong { background: var(--wrong-bg); color: var(--wrong-text); }

    @media (max-width: 768px) {
      .question-card { padding: 18px; }
      .app-header { padding: 12px 16px; }
      .omr-grid { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🎯 117회 매경TEST 실전 예측 모의고사 (80문항 완벽구현)</h1>
    <div class="header-btns">
      <button id="wrongOnlyBtn" class="btn-action btn-danger" onclick="filterWrongQuestions()">틀린 문제만 모아보기</button>
      <button id="showAllBtn" class="btn-action btn-secondary" onclick="showAllQuestions()" style="display:none;">전체 문제 보기</button>
      <button class="btn-action" onclick="resetAndShuffle()">리셋 & 순서 섞기</button>
    </div>
  </header>

  <div class="cbt-container">
    <main class="question-card">
      <div>
        <div class="question-header">
          <div class="badge-group">
            <span id="categoryBadge" class="category-badge">[경영] 기업경영과 조직</span>
            <span id="modeBadge" class="mode-badge">오답 복습 모드</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="reselectBtn" class="btn-action btn-warning" style="display:none; padding: 6px 12px; font-size: 0.8rem;" onclick="reselectAnswer()">🔄 답 다시 선택</button>
            <span class="progress-text"><strong id="currentIndex">1</strong> / <span id="totalIndex">80</span></span>
          </div>
        </div>

        <div id="questionTitle" class="question-title"></div>
        <div id="questionBox" class="question-box" style="display:none;"></div>
        <div id="optionsList" class="options-list"></div>
        <div id="explanationBox" class="explanation-box" style="display: none;"></div>
      </div>

      <div class="navigation-bar">
        <button id="prevBtn" class="nav-btn" onclick="prevQuestion()">◀ 이전</button>
        <span class="keyboard-tip">💡 정답 보기를 <strong>더블 클릭(더블 탭)</strong> 시 다음 문제로 바로 넘어갑니다</span>
        <button id="nextBtn" class="nav-btn" onclick="nextQuestion()">다음 ▶</button>
      </div>
    </main>

    <aside class="sidebar-card">
      <div class="omr-header">
        <h3>OMR 답안지</h3>
        <span id="scoreSummary" class="score-summary">맞힘: 0 / 80</span>
      </div>
      <div id="omrGrid" class="omr-grid"></div>
    </aside>
  </div>

  <script>
    const originalQuestions = [
      {
        id: 1,
        category: "[경영] 1장. 기업경영과 조직",
        question: "Q1. 다음 중 현대 기업경영 환경의 특징과 이를 대처하기 위한 경영 활동으로 가장 적절하지 않은 것은?",
        options: [
          "① 불확실성이 증가함에 따라 정형화된 장기 계획보다는 유연성(Agility)을 강조한다.",
          "② ESG 경영의 부각으로 재무적 성과뿐만 아니라 비재무적 가치 창출이 중요해졌다.",
          "③ 기술 융합 현상에 따라 기업 간 전략적 제휴 및 M&A의 중요성이 감소하고 있다.",
          "④ 플랫폼 비즈니스의 성장으로 양면 시장(Two-sided Market)의 이해가 중요해졌다.",
          "⑤ 대내외 환경 변화에 신속하게 대응하기 위해 린(Lean) 경영 및 아자일 조직이 주목받는다."
        ],
        answer: 3,
        explanation: "[정답 해설]\n• ③ (정답): 기술 융합과 급변하는 환경 속에서는 내부 자원만으로 대응하기 어렵기 때문에 전략적 제휴 및 M&A의 중요성이 오히려 커집니다.\n\n[오답 보기 해설]\n• ① 불확실성 증대로 유연성이 강조되는 것은 올바른 설명입니다.\n• ② ESG 경영으로 비재무적 가치(환경, 사회, 지배구조)가 중요해졌습니다.\n• ④ 양면 시장(플랫폼 양쪽 이용자 그룹 간 상호작용) 이해는 플랫폼 비즈니스의 핵심입니다.\n• ⑤ 린 경영과 아자일 조직은 신속한 변화 대응을 위한 대표적 경영 방식입니다.\n\n[핵심 키워드]\n• 유연성(Agility), ESG 경영, 전략적 제휴 및 M&A, 양면 시장, 아자일 조직"
      },
      {
        id: 2,
        category: "[경영] 1장. 기업경영과 조직",
        question: "Q2. 고전적 경영이론 중 테일러(F. Taylor)의 과학적 관리론에 대한 설명으로 가장 올바른 것은?",
        options: [
          "① 인간의 사회적·심리적 욕구가 생산성에 미치는 영향을 강조하였다.",
          "② 시간 및 동작 연구를 통해 표준 작업량을 설정하고 차등성과급제를 도입하였다.",
          "③ 조직 전체의 관리를 위한 행정 원칙 14가지를 제시하였다.",
          "④ 관료제 구상을 통해 권한의 유형을 명확히 하고 명문 규칙을 강조하였다.",
          "⑤ 환경 변화에 따른 조직 구조의 적응성을 중요시하였다."
        ],
        answer: 2,
        explanation: "[정답 해설]\n• ② (정답): 테일러의 과학적 관리론은 과업 관리, 시간·동작 연구를 통한 표준 작업량 설정, 차등성과급제가 핵심입니다.\n\n[오답 보기 해설]\n• ① 인간의 사회적·심리적 욕구를 강조한 것은 메이요 등의 '인간관계론'입니다.\n• ③ 조직 전체 관리를 위한 행정 원칙 14가지는 '페이욜의 행정관리론'입니다.\n• ④ 관료제와 권한 유형을 강조한 것은 '베버의 관료제론'입니다.\n• ⑤ 상황에 따른 적응을 강조한 것은 '상황이론(Contingency Theory)'입니다.\n\n[핵심 키워드]\n• 과학적 관리론, 시간·동작 연구, 차등성과급제, 테일러"
      },
      {
        id: 3,
        category: "[경영] 1장. 기업경영과 조직",
        question: "Q3. 다음에서 설명하는 조직구조 형태로 가장 적절한 것은?\n\n- 기능 부서의 전문성과 사업 부서의 유연성/스피드를 동시에 확보하기 위해 설계됨\n- 구성원이 원래 속한 기능 부서의 장과 프로젝트 관리자(PM) 두 명에게 보고하는 이중보고 체계를 가짐\n- 전문화 효과를 높일 수 있으나, 권한 충돌과 역할 갈등이 발생하기 쉬움",
        options: [
          "① 매트릭스 조직",
          "② 네트워크 조직",
          "③ 사업부제 조직",
          "④ 기능식 조직",
          "⑤ 팀 조직"
        ],
        answer: 1,
        explanation: "[정답 해설]\n• ① (정답): 이중보고 체계(Dual Command System)와 기능/사업 구조의 혼합은 매트릭스(Matrix) 조직의 대표적 특징입니다.\n\n[오답 보기 해설]\n• ② 네트워크 조직: 핵심 역량만 남기고 나머지를 아웃소싱하는 구조입니다.\n• ③ 사업부제 조직: 제품, 지역 등 사업별로 독립된 부서를 두는 구조입니다.\n• ④ 기능식 조직: 업무 전문 기능별로 편성된 전통적 구조입니다.\n• ⑤ 팀 조직: 자율성과 신속성을 강조한 소집단 조직입니다.\n\n[핵심 키워드]\n• 매트릭스 조직, 이중보고 체계, 프로젝트 관리자(PM)"
      },
      {
        id: 4,
        category: "[경영] 2장. 조직행동",
        question: "Q4. 동기부여 이론 중 허츠버그(F. Herzberg)의 2요인 이론에 관한 설명으로 옳지 않은 것은?",
        options: [
          "① 직무 만족을 주는 요인과 불만족을 주는 요인은 서로 독립되어 있다.",
          "② 급여, 작업 환경, 회사 정책 등은 동기요인(Motivator)에 해당한다.",
          "③ 불만족 요인(위생요인)을 제거하더라도 직무 만족도가 높아지는 것은 아니다.",
          "④ 성취감, 승진, 책임감, 인정 등은 직무 만족을 유발하는 동기요인이다.",
          "⑤ 직무 풍토화(Job Enrichment)는 동기요인을 강화하는 직무 설계 방법이다."
        ],
        answer: 2,
        explanation: "[정답 해설]\n• ② (정답): 급여, 작업 환경, 회사 정책 등은 불만족을 방지하는 '위생요인(Hygiene factors)'에 해당하므로 틀렸습니다.\n\n[오답 보기 해설]\n• ① 직무만족과 불만족은 하나의 연속선이 아니라 별개의 차원입니다.\n• ③ 위생요인은 불만족을 막을 뿐 적극적 만족을 주지 않습니다.\n• ④ 성취감, 인정 등은 만족을 주는 동기요인입니다.\n• ⑤ 직무풍요화는 동기요인을 강화하여 직무 만족도를 높입니다.\n\n[핵심 키워드]\n• 2요인 이론, 위생요인, 동기요인, 허츠버그"
      },
      {

        btn.onclick = (e) => handleOptionClick(q.id, optNum, e);
        btn.ontouchend = (e) => {
          e.preventDefault();
          handleOptionClick(q.id, optNum, e);
        };

        optionsList.appendChild(btn);
      });

      if (selectedOpt === undefined) {
        reselectBtn.style.display = 'none';
      } else {
        reselectBtn.style.display = 'inline-block';
      }

      const expBox = document.getElementById('explanationBox');
      if (selectedOpt !== undefined) {
        expBox.style.display = 'block';
        expBox.innerHTML = q.explanation.replace(/\n/g, '<br>');
      } else {
        expBox.style.display = 'none';
        expBox.innerHTML = '';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === currentQuestions.length - 1);

      updateOMRActive();
    }

    function handleOptionClick(qId, optNum, event) {
      const now = new Date().getTime();
      const currentAns = userAnswers[qId];

      if (currentAns === undefined) {
        userAnswers[qId] = optNum;
        renderQuestion();
        renderOMR();
        updateScoreSummary();
        clickTimers[qId] = { time: now, opt: optNum };
      } else {
        const lastClick = clickTimers[qId];
        if (lastClick && (lastClick.opt === optNum || (now - lastClick.time < 600))) {
          nextQuestion();
        } else {
          clickTimers[qId] = { time: now, opt: optNum };
        }
      }
    }

    function reselectAnswer() {
      const q = currentQuestions[currentIndex];
      if (confirm(`Q${q.id}번의 선택한 답을 초기화하고 다시 풀시겠습니까?`)) {
        delete userAnswers[q.id];
        renderQuestion();
        renderOMR();
        updateScoreSummary();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function renderOMR() {
      const omrGrid = document.getElementById('omrGrid');
      omrGrid.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'omr-item';
        if (idx === currentIndex) item.classList.add('active');

        const userAns = userAnswers[q.id];
        let statusText = '-';
        let statusClass = 'status-none';

        if (userAns !== undefined) {
          if (userAns === q.answer) {
            statusText = '정답';
            statusClass = 'status-correct';
          } else {
            statusText = '오답';
            statusClass = 'status-wrong';
          }
        }

        item.innerHTML = `
          <span>Q${String(q.id).padStart(2, '0')}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        omrGrid.appendChild(item);
      });
    }

    function updateOMRActive() {
      const items = document.querySelectorAll('.omr-item');
      items.forEach((item, idx) => {
        if (idx === currentIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function updateScoreSummary() {
      let correctCount = 0;
      originalQuestions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          if (userAnswers[q.id] === q.answer) correctCount++;
        }
      });
      document.getElementById('scoreSummary').innerText = `맞힘: ${correctCount} / ${originalQuestions.length}`;
    }

    function resetAndShuffle() {
      if (confirm('모든 답안을 초기화하고 문제 순서를 섞으시겠습니까?')) {
        isWrongOnlyMode = false;
        userAnswers = {};
        clickTimers = {};
        currentQuestions = [...originalQuestions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        
        document.getElementById('modeBadge').style.display = 'none';
        document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
        document.getElementById('showAllBtn').style.display = 'none';
        
        initApp();
      }
    }

    function filterWrongQuestions() {
      const wrongList = originalQuestions.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.answer);

      if (wrongList.length === 0) {
        alert('틀린 문제가 없습니다! (풀지 않았거나 모두 정답인 상태입니다)');
        return;
      }

      isWrongOnlyMode = true;
      currentQuestions = wrongList;
      currentIndex = 0;

      document.getElementById('modeBadge').innerText = `오답 복습 (${wrongList.length}개)`;
      document.getElementById('modeBadge').style.display = 'inline-block';
      document.getElementById('wrongOnlyBtn').style.display = 'none';
      document.getElementById('showAllBtn').style.display = 'inline-block';

      initApp();
    }

    function showAllQuestions() {
      isWrongOnlyMode = false;
      currentQuestions = [...originalQuestions];
      currentIndex = 0;

      document.getElementById('modeBadge').style.display = 'none';
      document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
      document.getElementById('showAllBtn').style.display = 'none';

      initApp();
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        nextQuestion();
      }
    });

    window.onload = initApp;
  </script>
</body>
</html>
